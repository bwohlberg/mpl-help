[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "mpl-help"
version         = "0.1.0rc3"
description     = "Backend-independent help windows for matplotlib figures"
readme          = "README.md"
license         = { file = "LICENSE" }
requires-python = ">=3.9"
authors         = [{ name = "Brendt Wohlberg", email = "brendt@ieee.org" }]
keywords        = ["matplotlib", "help", "keyboard shortcuts"]
classifiers     = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = ["matplotlib>=3.5"]

[project.optional-dependencies]
yaml   = ["pyyaml>=6.0"]
toml   = ["tomli>=2.0; python_version < '3.11'"]
config = ["pyyaml>=6.0", "tomli>=2.0; python_version < '3.11'"]
dev    = ["pyyaml>=6.0", "tomli>=2.0; python_version < '3.11'",
          "pytest>=7", "build", "twine"]

[project.urls]
Homepage      = "https://github.com/bwohlberg/mpl-help"
"Bug Tracker" = "https://github.com/bwohlberg/mpl-help/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mpl_help" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v"
