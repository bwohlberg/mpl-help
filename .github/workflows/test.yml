# Install and run the test suite on Linux and macOS

name: test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  workflow_dispatch:

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every supported Python on Linux, and the oldest and newest of
        # them on macOS.
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install Python 3
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[config]"
          pip install pytest
      - name: Run tests
        run: |
          pytest
